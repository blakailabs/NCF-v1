name: Company OS Kernel CI

on:
  push:
    branches:
      - feature/company-kernel-live-adapter-safety-v0.6
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-COMPANY-OS/11-KERNEL-RUNTIME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Live-Adapter Safety v0.6
        run: PYTHONPATH=. python scripts/validate_v06.py
