name: Company Kernel Trust v0.3

on:
  push:
    branches:
      - feature/company-kernel-trust-v0.3
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-COMPANY-OS/11-KERNEL-RUNTIME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q kernel tests examples
      - name: Test
        run: PYTHONPATH=. python -m unittest discover -s tests -v
