openapi: 3.1.0
info:
  title: Company Kernel API
  version: 0.1.0
  description: Privileged syscall/control-plane contract for CFHS Company OS.
servers:
  - url: http://localhost:8042
security:
  - KernelSession: []
paths:
  /v1/health:
    get:
      operationId: kernelHealth
      security: []
      responses:
        '200':
          description: Kernel health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/authorize:
    post:
      operationId: authorize
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDecision'
        default:
          $ref: '#/components/responses/KernelError'
  /v1/processes:
    post:
      operationId: spawnProcess
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessSpawnRequest'
      responses:
        '201':
          description: Process created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        default:
          $ref: '#/components/responses/KernelError'
  /v1/processes/{process_id}:
    get:
      operationId: getProcess
      parameters:
        - name: process_id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        default:
          $ref: '#/components/responses/KernelError'
  /v1/processes/{process_id}/signals:
    post:
      operationId: signalProcess
      parameters:
        - name: process_id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signal]
              properties:
                signal:
                  type: string
                  enum: [PAUSE, RESUME, CANCEL, TERMINATE]
                reason: {type: string}
      responses:
        '202': {description: Signal accepted}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/processes/{process_id}/checkpoints:
    post:
      operationId: checkpointProcess
      parameters:
        - name: process_id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '201': {description: Checkpoint created}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/fs/stat:
    post:
      operationId: fsStat
      x-cfhs-syscall: stat
      parameters: &ctx
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FsPathRequest'}
      responses:
        '200': {description: Metadata, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/fs/list:
    post:
      operationId: fsList
      x-cfhs-syscall: list
      parameters: *ctx
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FsPathRequest'}}}
      responses:
        '200': {description: Directory entries, content: {application/json: {schema: {type: array, items: {type: object}}}}}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/fs/read:
    post:
      operationId: fsRead
      x-cfhs-syscall: read
      parameters: *ctx
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FsPathRequest'}}}
      responses:
        '200': {description: File data, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/fs/write:
    post:
      operationId: fsWrite
      x-cfhs-syscall: write
      parameters: *ctx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FsPathRequest'
                - type: object
                  required: [data]
                  properties:
                    data: {}
      responses:
        '200': {description: Write result}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/events:
    post:
      operationId: emitEvent
      parameters: *ctx
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KernelEvent'}
      responses:
        '202': {description: Event accepted}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/queues/{queue}/messages:
    post:
      operationId: enqueue
      parameters:
        - name: queue
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses:
        '202': {description: Message queued}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/devices:
    get:
      operationId: listDevices
      parameters: *ctx
      responses:
        '200': {description: Devices, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeviceDescriptor'}}}}}
        default: {$ref: '#/components/responses/KernelError'}
  /v1/devices/{device_id}:
    get:
      operationId: describeDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200': {description: Device descriptor, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceDescriptor'}}}}
